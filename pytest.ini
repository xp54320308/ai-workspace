[pytest]
markers =
    core: 单元测试（无需外部依赖）
    backend: 后端集成测试（需要 Ollama + ChromaDB）
    e2e: 端到端测试（需要完整环境）

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认运行所有测试
# 使用 -m 过滤:
#   pytest tests/ -m core     # 只运行单元测试
#   pytest tests/ -m backend  # 只运行后端测试
#   pytest tests/ -m e2e      # 只运行端到端
addopts = -v
